<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memorabilius — Hors ligne</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f8f9ff;
      color: #111;
      padding: 24px;
      text-align: center;
    }
    img { width: 72px; height: 72px; border-radius: 16px; margin-bottom: 20px; }
    h1 { font-size: 22px; font-weight: 800; margin-bottom: 8px; color: #003DA6; }
    p { font-size: 15px; color: #555; line-height: 1.5; max-width: 300px; margin-bottom: 28px; }
    button {
      background: #003DA6; color: #fff; border: none;
      border-radius: 12px; padding: 12px 28px;
      font-size: 15px; font-weight: 700; cursor: pointer;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0a0a0a; color: #f0f0f0; }
      p { color: #aaa; }
    }
  </style>
</head>
<body>
  <img src="/icon-192.png" alt="Memorabilius">
  <h1>Tu es hors ligne</h1>
  <p>Vérifie ta connexion internet et réessaie. Tes cartes déjà visitées restent accessibles.</p>
  <button onclick="window.location.reload()">Réessayer</button>
</body>
</html>
