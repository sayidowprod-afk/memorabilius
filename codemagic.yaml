# Build de l'app iPhone sur un Mac loué (Codemagic), envoyé automatiquement sur TestFlight.
# Lancé À LA MAIN depuis le tableau de bord Codemagic (aucun déclencheur automatique : on ne consomme des minutes que quand tu le décides).
# Mise en place complète : docs/ios-publication.md
workflows:
  ios-testflight:
    name: iOS vers TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: Memorabilius          # nom de la clé API App Store Connect enregistrée dans Codemagic
    environment:
      groups:
        - ios_secrets                          # contient GOOGLE_SERVICE_INFO_PLIST_BASE64 (fichier Firebase iOS, en base64)
      ios_signing:
        distribution_type: app_store
        bundle_identifier: fr.memorabilius.app
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Installer les dépendances
        script: npm ci
      - name: Créer le projet iOS (il n'est pas dans le dépôt)
        script: npx cap add ios --packagemanager CocoaPods
      - name: Fichier Firebase
        script: echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/App/App/GoogleService-Info.plist
      - name: Préparer le projet (permissions, notifications, entitlements)
        script: node scripts/ios-prepare.js
      - name: Icônes
        script: |
          node scripts/ios-icon.js before
          npx capacitor-assets generate --ios
          node scripts/ios-icon.js after
      - name: Synchroniser Capacitor et installer les pods
        script: npx cap sync ios
      - name: Numéro de build
        script: sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/" ios/App/App.xcodeproj/project.pbxproj
      - name: Signature
        script: xcode-project use-profiles
      - name: Compiler l'app
        script: xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
