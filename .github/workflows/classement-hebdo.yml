name: Classement hebdomadaire

# Chaque lundi : calcule le podium des cartes ajoutées et le classement des pronos de la semaine passée,
# fabrique les visuels (stories Instagram + post X) et les envoie sur un salon Discord.
# Secrets nécessaires : NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, DISCORD_WEBHOOK_URL.
on:
  schedule:
    - cron: '20 5 * * 1' # premier essai : 6 h 20 (hiver) / 7 h 20 (été) à Paris
    - cron: '20 6 * * 1' # second essai si le premier a été sauté ou retardé par GitHub
  workflow_dispatch: # lancement manuel depuis l'onglet Actions

permissions:
  contents: read

jobs:
  garde:
    # Deux horaires par jour (le planificateur de GitHub saute ou retarde parfois un lancement) :
    # si l'envoi du jour a déjà réussi, le second lancement ne fait rien. Un lancement manuel n'est jamais bloqué.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      deja: ${{ steps.verif.outputs.deja }}
    steps:
      - id: verif
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          deja=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            n=$(gh run list --workflow "${{ github.workflow }}" --event schedule --status success --created "$(date -u +%F)" --json databaseId --jq length)
            if [ "${n:-0}" -gt 0 ]; then deja=true; fi
          fi
          echo "deja=$deja" >> "$GITHUB_OUTPUT"

  classement:
    needs: garde
    if: needs.garde.outputs.deja != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/classement_hebdo.py
            public/Surfquest-NoSlash.otf
            public/Memorabiliuslogo.png
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Police et bibliothèques
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-open-sans
          pip install --quiet pillow numpy

      - name: Calcul, visuels et envoi sur Discord
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
        run: python scripts/classement_hebdo.py --last --discord
