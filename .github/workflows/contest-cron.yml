name: Concours Discord hebdomadaire

on:
  # Declenchement automatique deplace vers Vercel Cron (voir vercel.json) --
  # plus ponctuel que GitHub Actions, qui met en file d'attente les jobs
  # programmes pile a l'heure ronde en cas de forte charge (retards constates
  # de plusieurs heures en prod). Garde ici uniquement pour un test manuel.
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Appeler le endpoint de tick du concours
        run: |
          curl -sf -X GET "https://memorabilius.fr/api/contest/tick" \
            -H "Authorization: Bearer ${{ secrets.CONTEST_CRON_SECRET }}" \
            -w "\nHTTP %{http_code}\n"
