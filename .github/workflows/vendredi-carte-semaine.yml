name: Vendredi carte de la semaine

# Chaque vendredi vers 6 h 30-7 h 30 (Paris) : envoie sur Discord le texte du tweet « ta carte de la semaine »
# et une carte d'exemple choisie parmi celles ajoutées ces 7 derniers jours.
# Secrets : NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, DISCORD_WEBHOOK_URL, DISCORD_USER_ID.
on:
  schedule:
    - cron: '20 5 * * 5' # premier essai : 6 h 20 (hiver) / 7 h 20 (été) à Paris
    - cron: '20 6 * * 5' # second essai si le premier a été sauté ou retardé par GitHub
  workflow_dispatch:

permissions:
  contents: read

jobs:
  garde:
    # Deux horaires par jour (le planificateur de GitHub saute ou retarde parfois un lancement) :
    # si l'envoi du jour a déjà réussi, le second lancement ne fait rien. Un lancement manuel n'est jamais bloqué.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      deja: ${{ steps.verif.outputs.deja }}
    steps:
      - id: verif
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          deja=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            n=$(gh run list --workflow "${{ github.workflow }}" --event schedule --status success --created "$(date -u +%F)" --json databaseId --jq length)
            if [ "${n:-0}" -gt 0 ]; then deja=true; fi
          fi
          echo "deja=$deja" >> "$GITHUB_OUTPUT"

  vendredi:
    needs: garde
    if: needs.garde.outputs.deja != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/classement_hebdo.py
            scripts/carte_mystere.py
            scripts/vendredi_carte_semaine.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bibliothèques et navigateur (pour l'export photo)
        run: |
          pip install --quiet pillow numpy playwright
          playwright install --with-deps chromium

      - name: Texte du tweet et carte d'exemple vers Discord
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
        run: python scripts/vendredi_carte_semaine.py --discord
