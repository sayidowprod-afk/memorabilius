name: Carte mystère

# Mercredi vers 6 h 30-7 h 30 (Paris) : choisit une carte (autos d'abord), fabrique toute la journée d'un coup
# (le mystère, l'indice, la réponse), et envoie le tout sur Discord avec les heures conseillées pour publier.
# L'historique des joueurs déjà proposés est mémorisé dans le stockage privé R2 (_meta/mystere-etat.json).
# Secrets : NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, DISCORD_WEBHOOK_URL, CF_R2_*.
on:
  schedule:
    - cron: '30 5 * * 3' # mercredi 5 h 30 UTC = 6 h 30 (hiver) / 7 h 30 (été) à Paris
  workflow_dispatch:
    inputs:
      mode:
        description: 'tout (le programme du jour), mystere ou resultat (pour un essai isolé)'
        type: choice
        options: [tout, mystere, resultat]
        default: tout

permissions:
  contents: read

concurrency:
  group: carte-mystere
  cancel-in-progress: false

jobs:
  mystere:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_ENDPOINT_URL: https://${{ secrets.CF_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      ETAT_R2: s3://${{ secrets.CF_R2_BUCKET }}/_meta/mystere-etat.json
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'tout' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/classement_hebdo.py
            scripts/carte_mystere.py
            scripts/carte_mystere_auto.py
            scripts/models
            public/Surfquest-NoSlash.otf
            public/Memorabiliuslogo.png
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Police et bibliothèques
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-open-sans
          pip install --quiet pillow numpy "opencv-python-headless==4.10.0.84"

      - name: Récupérer la mémoire (carte du jour, joueurs déjà proposés)
        run: |
          aws s3 cp "$ETAT_R2" etat.json && echo "Etat recupere" || echo "Aucun etat precedent, depart a zero"

      - name: Carte mystère (${{ env.MODE }})
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
        run: python scripts/carte_mystere_auto.py "$MODE" --etat etat.json --discord

      - name: Sauvegarder la mémoire
        run: aws s3 cp etat.json "$ETAT_R2"
